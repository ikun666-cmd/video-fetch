name: fetch-youtube-video

# 云端跑 yt-dlp -> 本机取回文件。整个仓库只需要这一个 workflow 文件。
# 触发：Actions 页 -> Run workflow -> 填 video_url。
# 前置 Secret：YT_COOKIES_B64（cookies.txt 的 base64，见同目录 README.md）

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube watch URL"
        required: true
        default: "https://www.youtube.com/watch?v=zQnDOa3wacM"
      use_cookies:
        description: "Use YT_COOKIES_B64 secret"
        type: boolean
        default: true
      publish_release:
        description: "Also publish a Release asset (public direct link)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yt-dlp
        run: python -m pip install -U yt-dlp

      - name: Restore cookies from secret
        if: ${{ inputs.use_cookies }}
        env:
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
        run: |
          if [ -z "$YT_COOKIES_B64" ]; then
            echo "::warning::YT_COOKIES_B64 empty - continuing without cookies"
          else
            printf '%s' "$YT_COOKIES_B64" | base64 -d > cookies.txt
            echo "cookies restored: $(grep -vc '^#' cookies.txt) rows"
          fi

      - name: Probe formats (cheap, no download)
        continue-on-error: true
        env:
          URL: ${{ inputs.video_url }}
        run: |
          ARGS=(--js-runtimes node --remote-components ejs:github -4
                --socket-timeout 30 --retries 0 --simulate -F)
          if [ -f cookies.txt ]; then ARGS+=(--cookies cookies.txt); fi
          python -m yt_dlp "${ARGS[@]}" "$URL" 2>&1 | tail -40

      - name: Download (4-tier fallback)
        env:
          URL: ${{ inputs.video_url }}
        run: |
          mkdir -p out
          COMMON=(--no-warnings --js-runtimes node --remote-components ejs:github -4
                  --sleep-requests 1 --socket-timeout 40 --retries 1
                  --write-subs --write-auto-subs --sub-langs "en.*"
                  --write-thumbnail --write-info-json)
          if [ -f cookies.txt ]; then COMMON+=(--cookies cookies.txt); fi

          try() {
            tag="$1"; shift
            echo "=== strategy $tag ==="
            python -m yt_dlp "${COMMON[@]}" "$@" -o "out/${tag}_%(id)s.%(ext)s" "$URL" 2>&1 | tail -25
            if ls out/${tag}_*.mp4 >/dev/null 2>&1; then return 0; fi
            return 1
          }

          # S0: web_safari 的 HLS(m3u8) 目前不需 GVS PO Token，2026-11-10 本机实测 1080p 成功
          try s0 --extractor-args "youtube:player_client=web_safari" \
                 -f "best[protocol=m3u8]/b[protocol=m3u8]/b" && exit 0
          try s1 --extractor-args "youtube:player_client=mweb" \
                 -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/b" && exit 0
          try s2 --extractor-args "youtube:player_client=tv,web_embedded,android_vr,web_safari" \
                 -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/b" && exit 0
          try s3 -f "18/b[ext=mp4]/b" && exit 0

          echo "ALL_STRATEGIES_FAILED"
          exit 1

      - name: Verify container and resolution
        run: |
          f=$(ls -S out/*.mp4 | head -1)
          echo "file: $f"
          ls -lh "$f"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height -show_entries format=duration \
            -of default=noprint_wrappers=1 "$f"
          ffmpeg -v error -i "$f" -c copy -f null - && echo "CONTAINER_OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: out/
          retention-days: 1
          overwrite: true

      - name: Publish release (optional)
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" out/* --title "$TAG" --notes "auto-generated by fetch-video"
          echo "RELEASE=$TAG"
